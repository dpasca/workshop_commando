<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commando Workshop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #d8dde2; font: 13px/1.35 "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; }
      #app { display: flex; height: 100%; }
      #game { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }

      /* ---- editor panel ---- */
      #editor { width: 460px; flex: none; box-sizing: border-box; padding: 10px 12px 16px; overflow-y: auto; background: #1b2026; border-left: 1px solid #000; }
      #editor.collapsed { display: none; }
      #editor button, #editor select, #editor input { font: inherit; color: inherit; background: #2a323a; border: 1px solid #3a444e; border-radius: 4px; padding: 3px 8px; }
      #editor button { cursor: pointer; }
      #editor button:hover:not(:disabled) { background: #36414b; }
      #editor button:disabled { opacity: 0.4; cursor: default; }
      #editor button.primary { background: #2d6a3f; border-color: #3f8b56; }
      #editor button.on { background: #3b5872; border-color: #5a86ad; }
      #editor kbd { opacity: 0.7; font: 11px Menlo, monospace; margin-left: 4px; }
      .ed-head, .ed-bar, .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
      .ed-head select { min-width: 150px; }
      .pill { margin-left: auto; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
      .pill.ok { background: #23412c; color: #9fe0b1; }
      .pill.warn { background: #55401a; color: #ffd27a; }
      .hint { color: #7c8791; font-size: 12px; }
      .ed-tabs { display: flex; gap: 6px; align-items: center; margin: 4px 0 8px; }
      .ed-tabs .hint { margin-left: auto; }
      .seg { display: flex; }
      .seg button:first-child { border-radius: 4px 0 0 4px; }
      .seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
      #ed-palette { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      #ed-palette .pal { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px; width: 46px; font: 11px Menlo, monospace; }
      #ed-palette canvas { width: 32px; height: 32px; border-radius: 3px; }
      #ed-hover { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #ed-map { margin-top: 6px; }
      .map-wrap { position: relative; width: max-content; border: 1px solid #000; }
      .map-wrap canvas { display: block; }
      .map-wrap canvas:first-child { cursor: crosshair; }
      .map-live { position: absolute; inset: 0; pointer-events: none; }
      .msg { white-space: pre-wrap; margin: 6px 0; padding: 6px 8px; border-radius: 4px; font: 12px Menlo, monospace; }
      .msg.error { background: #4a2222; color: #ffb0a0; }
      .msg.warn { background: #4a3c1c; color: #ffd98a; }
      .msg button { display: block; margin-top: 6px; }
      fieldset { border: 1px solid #333c45; border-radius: 4px; margin: 0 0 8px; padding: 6px 8px; }
      legend { color: #9fb2c4; padding: 0 4px; }
      .field { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      .field span { width: 110px; flex: none; color: #aab5bf; }
      .field input[type="text"], .field input[type="number"], .field select { flex: 1; min-width: 0; }
      .field input[type="number"] { max-width: 90px; flex: none; }
      #editor textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: #232a31; border: 1px solid #3a444e; border-radius: 4px; padding: 6px 8px; resize: vertical; margin-bottom: 6px; }
      details.ask { border: 1px solid #333c45; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; }
      details.ask summary { cursor: pointer; color: #9fb2c4; margin-bottom: 6px; }
      details.ask label { color: #aab5bf; }
      .msg.info { background: #1f3a2b; color: #bff0cf; font-family: inherit; font-size: 13px; }
      .hist { padding: 1px 0; color: #aab5bf; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hist:hover { color: #fff; }
      .hist.accepted { color: #9fe0b1; } .hist.rejected, .hist.failed { color: #c98a82; } .hist.needs { color: #e0c27a; }
      #ed-check { margin: 6px 0; font-size: 12px; }
      #ed-check.ok > div:first-child { color: #9fe0b1; } #ed-check.bad > div:first-child { color: #ffb0a0; }
      #ed-check .issue { color: #c9a98a; font: 11px Menlo, monospace; padding-left: 12px; }
      .preview { margin-left: auto; width: 96px; height: 96px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <aside id="editor"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
